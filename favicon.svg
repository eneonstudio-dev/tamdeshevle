<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" data-icon="peeking-bay" role="img" aria-labelledby="title">
  <title id="title">Votonobay — Бай</title>
  <rect width="64" height="64" rx="16" fill="#07100B"/>
  <circle cx="32" cy="35" r="25" fill="#0E2B1C" opacity=".82"/>

  <!-- ears -->
  <path d="M17 30 19 15c.3-2.2 2.8-3.2 4.5-1.7L30 20m17 10-2-15c-.3-2.2-2.8-3.2-4.5-1.7L34 20" fill="#F3F0E7" stroke="#1A211D" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="m21 18 1 8 5-5m16-3-1 8-5-5" fill="#D8A9A3" opacity=".72"/>

  <!-- head peeking from the lower edge -->
  <path d="M14 49c0-16 6.8-27 18-27s18 11 18 27v15H14Z" fill="#F6F3EA" stroke="#1B211D" stroke-width="2.4"/>

  <!-- snow-leopard spots -->
  <g fill="#2B312E">
    <ellipse cx="24" cy="28" rx="2.6" ry="1.7" transform="rotate(-18 24 28)"/>
    <ellipse cx="40" cy="28" rx="2.6" ry="1.7" transform="rotate(18 40 28)"/>
    <ellipse cx="19.5" cy="36" rx="2.1" ry="1.5" transform="rotate(-28 19.5 36)"/>
    <ellipse cx="44.5" cy="36" rx="2.1" ry="1.5" transform="rotate(28 44.5 36)"/>
    <ellipse cx="32" cy="25" rx="2.1" ry="1.4"/>
  </g>

  <!-- eyes -->
  <path d="M21.5 36c2.2-3 6.2-3.1 8.4-.1-2.2 4.5-6.4 4.6-8.4.1Zm20.9 0c-2.2-3-6.2-3.1-8.4-.1 2.2 4.5 6.4 4.6 8.4.1Z" fill="#4FF59A" stroke="#16201A" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="26" cy="36" r="1.4" fill="#08110C"/><circle cx="38" cy="36" r="1.4" fill="#08110C"/>
  <circle cx="25.4" cy="35.3" r=".45" fill="#fff"/><circle cx="37.4" cy="35.3" r=".45" fill="#fff"/>

  <!-- muzzle -->
  <path d="M28.6 42.2c1.7-1.4 5.1-1.4 6.8 0-.4 2.2-2 3.3-3.4 3.3s-3-1.1-3.4-3.3Z" fill="#463D3D"/>
  <path d="M32 45.2v2.3m0 0c-1.2 1.3-2.5 1.5-3.7.9m3.7-.9c1.2 1.3 2.5 1.5 3.7.9" fill="none" stroke="#3A403C" stroke-width="1.3" stroke-linecap="round"/>

  <!-- paws on the edge: the key peeking silhouette -->
  <g fill="#F6F3EA" stroke="#1B211D" stroke-width="2.2">
    <path d="M11 58c0-5 3.4-8 8-8s8 3 8 8v6H11Z"/>
    <path d="M37 58c0-5 3.4-8 8-8s8 3 8 8v6H37Z"/>
  </g>
  <path d="M16 55.5h6m20 0h6" stroke="#CBC8BF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- tiny brand spark, secondary to Bay -->
  <path d="M51 15v-4m3 7 3-2" fill="none" stroke="#4FF59A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
