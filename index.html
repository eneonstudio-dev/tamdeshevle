<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F7B4A" />
  <title>Тамдешевле — где выгоднее эта корзина</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f5f2; --text:#122017; --muted:#66756b; --line:#e4ebe5; --green:#0f7b4a; --green-2:#16a34a; --soft:#e7f6ee; --yellow:#ffe14a; --shadow:0 8px 28px rgba(18,32,23,.08); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Manrope,system-ui,sans-serif; background:#cfd6d1; color:var(--text); }
    .phone { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); position:relative; overflow:hidden; }
    header.app { position:sticky; top:0; z-index:20; background:rgba(243,245,242,.94); backdrop-filter:blur(14px); padding:12px 16px 8px; }
    .brand,.row { display:flex; align-items:center; gap:10px; }
    .grow { flex:1; }
    h1 { font-size:20px; letter-spacing:-.03em; line-height:1.1; }
    .sub { color:var(--muted); font-size:12px; font-weight:700; margin-top:2px; }
    .back,.city { border:0; background:#fff; border-radius:12px; cursor:pointer; font-family:inherit; }
    .back { width:36px; height:36px; font-size:18px; }
    .city { padding:8px 10px; font-weight:800; font-size:12px; }
    .chips { display:flex; gap:8px; overflow:auto; padding:8px 16px 2px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { border:0; background:#fff; border-radius:999px; padding:8px 12px; font:700 13px Manrope; cursor:pointer; white-space:nowrap; }
    .chip.on { background:var(--green); color:#fff; }
    .wrap { padding:10px 16px 128px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .store { background:#fff; border:0; border-radius:18px; overflow:hidden; text-align:left; cursor:pointer; box-shadow:var(--shadow); }
    .cover { height:76px; color:#fff; display:flex; align-items:flex-end; padding:10px; font-weight:800; }
    .meta { padding:10px; }
    .name { font-weight:800; font-size:14px; }
    .time { color:var(--muted); font-size:12px; margin-top:2px; }
    .badge { display:inline-block; background:var(--green-2); color:#fff; font-size:11px; font-weight:800; border-radius:999px; padding:3px 7px; }
    .search,.addr { width:100%; border:0; background:#fff; border-radius:14px; padding:12px 14px; font:600 14px Manrope; margin-bottom:10px; }
    .item { background:#fff; border-radius:16px; padding:10px; display:grid; grid-template-columns:58px 1fr auto; gap:10px; align-items:center; margin-bottom:8px; }
    .thumb { width:58px; height:58px; border-radius:12px; display:grid; place-items:center; font-size:26px; background:var(--soft); }
    .title { font-weight:800; font-size:14px; }
    .pack { color:var(--muted); font-size:12px; margin:2px 0 4px; }
    .price { font-weight:800; }
    .step { display:flex; align-items:center; gap:8px; }
    .step button { width:28px; height:28px; border:0; border-radius:9px; background:#eef3ef; font-weight:800; cursor:pointer; }
    .dock { position:fixed; left:50%; transform:translateX(-50%); width:min(430px,100%); bottom:0; padding:10px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--bg) 28%); }
    .btn { width:100%; border:0; border-radius:16px; padding:14px 16px; font:800 15px Manrope; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
    .btn.yellow { background:var(--yellow); }
    .btn.dark,.btn.green { justify-content:center; color:#fff; }
    .btn.dark { background:#122017; }
    .btn.green { background:var(--green); }
    .ghost { width:100%; margin-top:8px; border:0; background:#fff; border-radius:14px; padding:12px; font:700 14px Manrope; cursor:pointer; }
    .plan { background:#fff; border-radius:20px; padding:14px; margin-bottom:10px; border:2px solid transparent; }
    .plan.best { border-color:var(--green); background:#f2fbf5; }
    .sum { font-size:28px; letter-spacing:-.04em; margin:4px 0; }
    .delta { color:var(--green); font-weight:800; }
    .hint { color:var(--muted); font-size:13px; font-weight:600; }
    .toggle { display:flex; background:#fff; border-radius:14px; padding:4px; margin-bottom:12px; }
    .toggle button { flex:1; border:0; background:transparent; border-radius:11px; padding:10px 6px; font:800 12px Manrope; cursor:pointer; }
    .toggle button.on { background:#122017; color:#fff; }
    .note { background:#fff; border-radius:14px; padding:12px; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:12px; }
    .why-line { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <div class="phone" id="app"></div>
  <script src="app.js"></script>
  <script src="catalog-boot.js"></script>
</body>
</html>
