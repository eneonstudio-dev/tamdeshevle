name: Validate data and scripts

on:
  pull_request:
  push:
    branches:
      - main
      - chatgpt/architecture-cleanup
      - chatgpt/retailer-adapter-perekrestok
      - chatgpt/sku-matcher
      - chatgpt/retailer-price-overlay
      - chatgpt/price-provenance
      - chatgpt/retailer-adapter-magnit
      - chatgpt/magnit-live-overlay
      - chatgpt/collector-magnit
      - chatgpt/retailer-adapter-pyat
      - chatgpt/pyat-store-scoped-collector
      - chatgpt/retailer-product-images
      - chatgpt/data-freshness-health
      - chatgpt/geo-lenta
      - chatgpt/store-id-bridge
      - chatgpt/store-basket-map
      - chatgpt/store-point-details
      - chatgpt/worth-it
      - chatgpt/on-the-way-final2
      - chatgpt/smart-substitutions
      - chatgpt/price-history
      - chatgpt/profile-basket-today
      - chatgpt/account-hub
      - chatgpt/auth-backend

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON data contracts
        run: node scripts/validate-data.mjs
      - name: Test data freshness and health
        run: node scripts/test-data-quality.mjs
      - name: Test comparison engine
        run: node scripts/test-comparison.mjs
      - name: Test trust labels and ranking gates
        run: node scripts/test-trust-ui.mjs
      - name: Test receipt observation contract
        run: node scripts/test-receipt-observations.mjs
      - name: Test receipt verification gates
        run: node scripts/test-receipt-verification.mjs
      - name: Test receipt price adapter
        run: node scripts/test-receipt-price-adapter.mjs
      - name: Test local receipt backup tools
        run: node scripts/test-receipt-local-tools.mjs
      - name: Test local receipt review safety
        run: node scripts/test-receipt-local-review.mjs
      - name: Test store ID basket bridge
        run: node scripts/test-store-id-bridge.mjs
      - name: Test geo point details wiring
        run: node scripts/test-geo-store-map-source.mjs
      - name: Test mobile store flow smoke checks
        run: node scripts/test-mobile-smoke-flow.mjs
      - name: Test worth-it recommendations
        run: node scripts/test-worth-it.mjs
      - name: Test on-the-way recommendations
        run: node scripts/test-on-the-way.mjs
      - name: Test smart substitutions
        run: node scripts/test-smart-substitutions.mjs
      - name: Test price history and anti-fake discounts
        run: node scripts/test-price-history.mjs
      - name: Test profile and daily basket
        run: node scripts/test-profile-basket.mjs
      - name: Test account hub
        run: node scripts/test-account-hub.mjs
      - name: Test auth backend wiring
        run: node scripts/test-auth-backend.mjs
      - name: Test auth lifecycle regressions
        run: node scripts/test-auth-lifecycle.mjs
      - name: Test Perekrestok adapter
        run: node scripts/test-retailer-adapter.mjs
      - name: Test Magnit adapter
        run: node scripts/test-magnit-adapter.mjs
      - name: Test Magnit collector
        run: node scripts/test-magnit-collector.mjs
      - name: Test Pyaterochka adapter
        run: node scripts/test-pyat-adapter.mjs
      - name: Test Pyaterochka collector
        run: node scripts/test-pyat-collector.mjs
      - name: Test Proshoper regional collector parser
        run: node scripts/test-proshoper-collector.mjs
      - name: Test Lenta adapter
        run: node scripts/test-lenta-adapter.mjs
      - name: Test Dixy adapter
        run: node scripts/test-dixy-adapter.mjs
      - name: Test SKU matcher
        run: node scripts/test-sku-matcher.mjs
      - name: Test retailer overlay pipeline
        run: node scripts/test-retailer-overlay.mjs
      - name: Regenerate retailer overlays
        run: |
          node scripts/build-retailer-overlay.mjs data/retailers/perekrestok.sample.json /tmp/perekrestok.overlay.json
          diff -u data/retailers/perekrestok.overlay.json /tmp/perekrestok.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/magnit.sample.json /tmp/magnit.overlay.json
          diff -u data/retailers/magnit.overlay.json /tmp/magnit.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/pyat.sample.json /tmp/pyat.overlay.json
          node -e "const o=require('/tmp/pyat.overlay.json'); const s=require('./data/retailers/pyat.sample.json'); if(o.scope_verified!==false || o.catalog_context?.price_scope!=='regional_catalog' || o.checked_at!==s.checked_at || !Object.values(o.prices||{}).every(Number.isFinite)) process.exit(2)"
          node scripts/build-retailer-overlay.mjs data/retailers/lenta.sample.json /tmp/lenta.overlay.json
          diff -u data/retailers/lenta.overlay.json /tmp/lenta.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/dixy.sample.json /tmp/dixy.overlay.json
          diff -u data/retailers/dixy.overlay.json /tmp/dixy.overlay.json
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check catalog-boot.js
          node --check store-boot.js
          node --check price-sync.js
          node --check data-quality.js
          node --check retailer-price-sync.js
          node --check collector-health.js
          node --check data-health-ui.js
          node --check price-provenance-ui.js
          node --check product-ui.js
          node --check store-id-bridge.js
          node --check geo-store-map.js
          node --check geo-store-map-theme.js
          node --check map-cluster-priority.js
          node --check selected-store-ui.js
          node --check map-one-tap.js
          node --check ui-layer-coordinator.js
          node --check bai-assistant.js
          node --check worth-it.js
          node --check on-the-way.js
          node --check smart-substitutions.js
          node --check price-history.js
          node --check receipt-observations.js
          node --check receipt-verification.js
          node --check receipt-price-adapter.js
          node --check receipt-entry-ui.js
          node --check receipt-local-tools.js
          node --check receipt-local-panel.js
          node --check receipt-local-review.js
          node --check profile-basket.js
          node --check account-hub.js
          node --check auth-client.js
          node --check account-auth-ui.js
          node --check supabase-config.js
          node --check data-layer.js
          node --check comparison-engine.js
          node --check runtime-bridge.js
          node --check retailers/perekrestok.mjs
          node --check retailers/magnit.mjs
          node --check retailers/magnit-collector.mjs
          node --check retailers/pyat.mjs
          node --check retailers/pyat-collector.mjs
          node --check retailers/proshoper-collector.mjs
          node --check retailers/lenta.mjs
          node --check retailers/dixy.mjs
          node --check retailers/sku-matcher.mjs
          node --check retailers/overlay-builder.mjs
          node --check scripts/build-retailer-overlay.mjs
          node --check scripts/collect-magnit.mjs
          node --check scripts/collect-pyat.mjs
          node --check scripts/collect-pyat-proshoper.mjs
          node --check scripts/update-collector-health.mjs
          node --check scripts/test-data-quality.mjs
          node --check scripts/test-trust-ui.mjs
          node --check scripts/test-receipt-observations.mjs
          node --check scripts/test-receipt-verification.mjs
          node --check scripts/test-receipt-price-adapter.mjs
          node --check scripts/test-receipt-local-tools.mjs
          node --check scripts/test-receipt-local-review.mjs
          node --check scripts/test-magnit-adapter.mjs
          node --check scripts/test-magnit-collector.mjs
          node --check scripts/test-pyat-adapter.mjs
          node --check scripts/test-pyat-collector.mjs
          node --check scripts/test-proshoper-collector.mjs
          node --check scripts/test-lenta-adapter.mjs
          node --check scripts/test-dixy-adapter.mjs
          node --check scripts/test-store-id-bridge.mjs
          node --check scripts/test-geo-store-map-source.mjs
          node --check scripts/test-mobile-smoke-flow.mjs
          node --check scripts/test-worth-it.mjs
          node --check scripts/test-on-the-way.mjs
          node --check scripts/test-smart-substitutions.mjs
          node --check scripts/test-price-history.mjs
          node --check scripts/test-profile-basket.mjs
          node --check scripts/test-account-hub.mjs
          node --check scripts/test-auth-backend.mjs
          node --check metrics.js
          node --check store-covers.js
          node --check gsap-motion.js
