name: Validate data and scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON data contracts
        run: node scripts/validate-data.mjs
      - name: Test data freshness and health
        run: node scripts/test-data-quality.mjs
      - name: Test comparison engine
        run: node scripts/test-comparison.mjs
      - name: Test trust labels and ranking gates
        run: node scripts/test-trust-ui.mjs
      - name: Test receipt observation contract
        run: node scripts/test-receipt-observations.mjs
      - name: Test receipt verification gates
        run: node scripts/test-receipt-verification.mjs
      - name: Test public receipt fixture safety
        run: node scripts/test-public-receipt-fixture.mjs
      - name: Test receipt price adapter
        run: node scripts/test-receipt-price-adapter.mjs
      - name: Test local receipt backup tools
        run: node scripts/test-receipt-local-tools.mjs
      - name: Test local receipt review safety
        run: node scripts/test-receipt-local-review.mjs
      - name: Test immutable receipt price history
        run: node scripts/test-receipt-price-history.mjs
      - name: Test store ID basket bridge
        run: node scripts/test-store-id-bridge.mjs
      - name: Test geo point details wiring
        run: node scripts/test-geo-store-map-source.mjs
      - name: Test mobile store flow smoke checks
        run: node scripts/test-mobile-smoke-flow.mjs
      - name: Test worth-it recommendations
        run: node scripts/test-worth-it.mjs
      - name: Test on-the-way recommendations
        run: node scripts/test-on-the-way.mjs
      - name: Test smart substitutions
        run: node scripts/test-smart-substitutions.mjs
      - name: Test price history and anti-fake discounts
        run: node scripts/test-price-history.mjs
      - name: Test profile and daily basket
        run: node scripts/test-profile-basket.mjs
      - name: Test account hub
        run: node scripts/test-account-hub.mjs
      - name: Test auth backend wiring
        run: node scripts/test-auth-backend.mjs
      - name: Test auth lifecycle regressions
        run: node scripts/test-auth-lifecycle.mjs
      - name: Test Perekrestok adapter
        run: node scripts/test-retailer-adapter.mjs
      - name: Test Magnit adapter
        run: node scripts/test-magnit-adapter.mjs
      - name: Test Magnit collector
        run: node scripts/test-magnit-collector.mjs
      - name: Test Pyaterochka adapter
        run: node scripts/test-pyat-adapter.mjs
      - name: Test Pyaterochka collector
        run: node scripts/test-pyat-collector.mjs
      - name: Test Proshoper regional collector parser
        run: node scripts/test-proshoper-collector.mjs
      - name: Test Lenta adapter
        run: node scripts/test-lenta-adapter.mjs
      - name: Test Dixy adapter
        run: node scripts/test-dixy-adapter.mjs
      - name: Test SKU matcher
        run: node scripts/test-sku-matcher.mjs
      - name: Test retailer overlay pipeline
        run: node scripts/test-retailer-overlay.mjs
      - name: Regenerate retailer overlays
        run: |
          node scripts/build-retailer-overlay.mjs data/retailers/perekrestok.sample.json /tmp/perekrestok.overlay.json
          diff -u data/retailers/perekrestok.overlay.json /tmp/perekrestok.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/magnit.sample.json /tmp/magnit.overlay.json
          diff -u data/retailers/magnit.overlay.json /tmp/magnit.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/pyat.sample.json /tmp/pyat.overlay.json
          node -e "const o=require('/tmp/pyat.overlay.json'); const s=require('./data/retailers/pyat.sample.json'); if(o.scope_verified!==false || o.catalog_context?.price_scope!=='regional_catalog' || o.checked_at!==s.checked_at || !Object.values(o.prices||{}).every(Number.isFinite)) process.exit(2)"
          node scripts/build-retailer-overlay.mjs data/retailers/lenta.sample.json /tmp/lenta.overlay.json
          diff -u data/retailers/lenta.overlay.json /tmp/lenta.overlay.json
          node scripts/build-retailer-overlay.mjs data/retailers/dixy.sample.json /tmp/dixy.overlay.json
          diff -u data/retailers/dixy.overlay.json /tmp/dixy.overlay.json
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          find retailers scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
