name: Validate app runtime resilience

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-app-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app syntax
        run: |
          node --check app.js
          node --check runtime-bridge.js
          node --check price-sync.js
          node --check v2-shell.js
          node --check v2-mobile-dock.js
          node --check ui-layer-coordinator.js
          node --check product-ui.js
          node --check price-history.js
          node --check v2-polish.js
          node --check gsap-motion.js
          node --check bai-life.js
          node --check account-auth-ui.js
          node --check purchase-flow.js
          node --check first-shopping-journey.js
          node --check comparison-result-v2.js
          node --check basket-split.js
          node --check basket-split-ui.js
          node --check smart-assembly-settings.js
          node --check brand-votonobay-v1.js
          node --check brand-prosche-v1.js
          node --check votonobay-inner-v1.js
          node --check scripts/test-catalog-resilience.mjs
          node --check scripts/test-product-card-resilience.mjs
          node --check scripts/test-first-shopping-journey.mjs
          node --check scripts/test-ui-lifecycle-resilience.mjs
          node --check scripts/test-runtime-performance.mjs
          node --check scripts/test-static-assets.mjs
          node --check scripts/test-mobile-runtime.mjs
          node --check scripts/test-account-modal-resilience.mjs
          node --check scripts/test-purchase-comparison-resilience.mjs
          node --check scripts/test-price-sync-resilience.mjs
          node --check scripts/test-basket-split.mjs
          node --check scripts/test-basket-split-ui.mjs
          node --check scripts/test-smart-assembly-settings.mjs
          node --check scripts/test-votonobay-brand.mjs
          node --check scripts/test-votonobay-inner-ui.mjs
      - name: Test app runtime resilience
        run: node scripts/test-app-runtime-resilience.mjs
      - name: Test catalog interaction resilience
        run: node scripts/test-catalog-resilience.mjs
      - name: Test product card resilience
        run: node scripts/test-product-card-resilience.mjs
      - name: Test first shopping journey
        run: node scripts/test-first-shopping-journey.mjs
      - name: Test UI lifecycle resilience
        run: node scripts/test-ui-lifecycle-resilience.mjs
      - name: Test price sync resilience
        run: node scripts/test-price-sync-resilience.mjs
      - name: Test multi-store basket truthfulness
        run: node scripts/test-basket-split.mjs
      - name: Test multi-store comparison UI
        run: node scripts/test-basket-split-ui.mjs
      - name: Test split travel-cost preferences
        run: node scripts/test-smart-assembly-settings.mjs
      - name: Test Votonobay brand contract
        run: node scripts/test-votonobay-brand.mjs
      - name: Test Votonobay inner UI contract
        run: node scripts/test-votonobay-inner-ui.mjs
      - name: Test runtime performance guards
        run: node scripts/test-runtime-performance.mjs
      - name: Test mobile runtime lifecycle
        run: node scripts/test-mobile-runtime.mjs
      - name: Test account modal resilience
        run: node scripts/test-account-modal-resilience.mjs
      - name: Test purchase and comparison resilience
        run: node scripts/test-purchase-comparison-resilience.mjs
      - name: Test static asset integrity
        run: node scripts/test-static-assets.mjs
