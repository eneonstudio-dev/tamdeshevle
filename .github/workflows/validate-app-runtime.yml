name: Validate app runtime resilience

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-app-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app syntax
        run: node --check app.js
      - name: Test app runtime resilience
        run: node scripts/test-app-runtime-resilience.mjs
