          node --check scripts/test-bai-sufficiency.mjs
          node --check scripts/test-bai-smart-substitutions.mjs
          node --check scripts/test-bai-meal-brain.mjs
          node --check scripts/test-bai-meal-pipeline.mjs
          node --check scripts/test-bai-pantry.mjs
          node --check scripts/test-bai-goal-memory.mjs
          node --check scripts/test-bai-question-selector.mjs
          node --check scripts/test-bai-personal-context-journey.mjs
          node --check scripts/test-bai-character.mjs
      - name: Test Bai conversation regressions
        run: |
          node scripts/test-bai-core-parser.mjs
          node scripts/test-bai-brain.mjs
          node scripts/test-bai-self-check.mjs
          node scripts/test-shopping-state-consistency.mjs
