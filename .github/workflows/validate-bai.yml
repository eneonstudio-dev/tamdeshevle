      - "ai-shopping-assistant.css"
      - "bai-*.js"
      - "gemma-*.js"
      - "BAI_CHARACTER_BIBLE.md"
      - "bai-learning-admin.html"
      - "bai-learning-admin.css"
      - "shopping-*.js"
      - "server/**"
      - "backend/**"
      - "pickup-flow-v1.js"
      - "courier-handoff-v1.js"
      - "continue-in-stores-v1.js"
      - "real-store-integration-v1.js"
      - "supabase-config.js"
      - "scripts/test-bai-core-parser.mjs"
      - "scripts/test-bai-brain.mjs"
      - "scripts/test-bai-self-check.mjs"
      - "scripts/test-shopping-state-consistency.mjs"
