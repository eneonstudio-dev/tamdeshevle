      - "scripts/test-bai-shopping-journey.mjs"
      - "scripts/test-bai-sufficiency.mjs"
      - "scripts/test-bai-smart-substitutions.mjs"
      - "scripts/test-bai-meal-brain.mjs"
      - "scripts/test-bai-meal-pipeline.mjs"
      - "scripts/test-bai-pantry.mjs"
      - "scripts/test-bai-goal-memory.mjs"
      - "scripts/test-bai-question-selector.mjs"
      - "scripts/test-bai-personal-context-journey.mjs"
      - "scripts/test-bai-character.mjs"
      - ".github/workflows/validate-bai.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Bai and shopping JavaScript syntax
        run: |
          node --check ai-shopping-assistant.js
          node --check bai-assistant.js
          node --check bai-voice.js
          node --check bai-brain.js
          node --check bai-checkout.js
          node --check bai-fallback-bridge.js
          node --check bai-food-knowledge.js
          node --check bai-sufficiency.js
          node --check bai-smart-substitutions.js
          node --check bai-meal-brain.js
          node --check bai-pantry.js
          node --check bai-goal-memory.js
          node --check bai-question-selector.js
          node --check bai-character.js
          node --check bai-life.js
          node --check bai-memory.js
          node --check bai-learning-safety.js
          node --check bai-learning-loop.js
          node --check bai-learning-admin.js
          node --check bai-agent-client.js
          node --check bai-autopilot.js
          node --check bai-shopping-journey.js
          node --check gemma-router.js
          node --check gemma-browser-worker.js
          node --check bai-planner.js
          node --check bai-self-check.js
          node --check shopping-conversation.js
          node --check shopping-optimizer.js
          node --check shopping-state.js
          node --check pickup-flow-v1.js
          node --check courier-handoff-v1.js
          node --check continue-in-stores-v1.js
          node --check real-store-integration-v1.js
          node --check server/bai-learning-consensus.mjs
          node --check server/bai-evolution-policy.mjs
          node --check scripts/test-bai-core-parser.mjs
          node --check scripts/test-bai-brain.mjs
          node --check scripts/test-bai-self-check.mjs
          node --check scripts/test-shopping-state-consistency.mjs
          node --check scripts/test-bai-learning-loop.mjs
          node --check scripts/test-bai-learning-safety.mjs
          node --check scripts/test-bai-learning-backend.mjs
          node --check scripts/test-bai-learning-admin.mjs
          node --check scripts/test-bai-memory-undo.mjs
          node --check scripts/test-bai-memory-outcomes.mjs
          node --check scripts/test-bai-handoff-e2e.mjs
          node --check scripts/test-bai-chat-runtime.mjs
          node --check scripts/test-bai-agent-core.mjs
          node --check scripts/test-bai-evolution.mjs
          node --check scripts/test-bai-autopilot.mjs
