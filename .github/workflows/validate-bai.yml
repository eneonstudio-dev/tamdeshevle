          node scripts/test-bai-shopping-journey.mjs
          node scripts/test-bai-sufficiency.mjs
          node scripts/test-bai-smart-substitutions.mjs
          node scripts/test-bai-meal-brain.mjs
          node scripts/test-bai-meal-pipeline.mjs
          node scripts/test-bai-pantry.mjs
          node scripts/test-bai-goal-memory.mjs
