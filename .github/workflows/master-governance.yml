name: Master governance gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require operational project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "VOTONOBAI_MASTER_ROADMAP.md"
            "PROJECT_STATUS.md"
            "AGENTS.md"
            "SOURCE_PROVIDER_REGISTRY.md"
            "REGRESSION_BANK.md"
            "DECISIONS/README.md"
            "RELEASE_GATE.md"
            "CLOSED_BETA_RELEASE_EVIDENCE.md"
            "RETAILER_CAPABILITIES.md"
            "MVP_SCENARIOS.md"
            "KNOWN_LIMITATIONS.md"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required project file: $file"; exit 1; }
          done

      - name: Guard foundational invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "independent AI shopper" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "UniversalBasket" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "StoreBasket" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "PurchasePlan" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "Money comes after Bay's decision" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "P0" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "Definition of Done" VOTONOBAI_MASTER_ROADMAP.md
          grep -Fq "rankable" SOURCE_PROVIDER_REGISTRY.md
          grep -Fq "does_not_prove" SOURCE_PROVIDER_REGISTRY.md
          grep -Fq "REG-" REGRESSION_BANK.md
          grep -Fq "COMPARE_ONLY" RETAILER_CAPABILITIES.md
          grep -Fq "API_ORDER" RETAILER_CAPABILITIES.md
          grep -Fq "MVP-001" MVP_SCENARIOS.md
          grep -Fq "Public launch" RELEASE_GATE.md
          grep -Fq "legacy `tamdeshevle`" KNOWN_LIMITATIONS.md

      - name: Validate closed-beta A-F release contract
        run: node scripts/test-closed-beta-release-gate.mjs

      - name: Validate project status freshness metadata
        shell: bash
        run: |
          set -euo pipefail
          updated=$(grep -m1 -E '^\*\*Updated:\*\* [0-9]{4}-[0-9]{2}-[0-9]{2}' PROJECT_STATUS.md | sed -E 's/^\*\*Updated:\*\* ([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
          test -n "$updated" || { echo "PROJECT_STATUS.md must contain **Updated:** YYYY-MM-DD"; exit 1; }
          python - "$updated" <<'PY'
          from datetime import date
          import sys
          stamp = date.fromisoformat(sys.argv[1])
          age = (date.today() - stamp).days
          if age < -1:
              raise SystemExit(f"PROJECT_STATUS.md update date is in the future: {stamp}")
          # Warn after 14 days; do not block solely on age because quiet periods are legitimate.
          if age > 14:
              print(f"::warning::PROJECT_STATUS.md is {age} days old; fresh-read main and refresh it if project state changed.")
          else:
              print(f"PROJECT_STATUS.md freshness: {age} day(s).")
          PY

      - name: Prevent accidental legacy-source-of-truth inversion
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl --exclude='VOTONOBAI_MASTER_ROADMAP.md' --exclude='PROJECT_STATUS.md' --exclude='master-governance.yml' \
            -E 'single source of truth.*tamdeshevle|master roadmap.*deprecated' . >/tmp/master_conflicts.txt 2>/dev/null; then
            echo "Potential governance conflict found:"
            cat /tmp/master_conflicts.txt
            exit 1
          fi

      - name: Governance summary
        run: echo "Votonobay MASTER governance and closed-beta A-F release contracts are present."