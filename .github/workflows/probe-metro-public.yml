name: Probe METRO public exact-store surface

on:
  pull_request:
    paths:
      - ".github/workflows/probe-metro-public.yml"
      - "scripts/probe-metro-public.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Probe one public METRO page once
        run: node scripts/probe-metro-public.mjs
