name: Validate Bay Engine

on:
  pull_request:
    paths:
      - "bai-engine-*.js"
      - "bai-provider-contract.js"
      - "scripts/test-bai-engine-*.mjs"
      - ".github/workflows/validate-bay-engine.yml"
  push:
    branches:
      - main
    paths:
      - "bai-engine-*.js"
      - "bai-provider-contract.js"
      - "scripts/test-bai-engine-*.mjs"
      - ".github/workflows/validate-bay-engine.yml"

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check Bay Engine syntax
        run: |
          node --check bai-engine-provider.js
          node --check bai-engine-router.js
          node --check scripts/test-bai-engine-provider.mjs
          node --check scripts/test-bai-engine-router.mjs
          node --check scripts/test-bai-engine-provider-switch.mjs
      - name: Test provider adapter contract
        run: node scripts/test-bai-engine-provider.mjs
      - name: Test router and deterministic fallback
        run: node scripts/test-bai-engine-router.mjs
      - name: Test provider-switch acceptance
        run: node scripts/test-bai-engine-provider-switch.mjs
