name: Validate Bai failure learning

on:
  pull_request:
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - "teacher-lab/training/compare_candidate_runs.py"
      - "teacher-lab/training/candidate_comparison_smoke.py"
      - "teacher-lab/training/data_factory_v2.py"
      - "teacher-lab/training/data_factory_v22.py"
      - "teacher-lab/training/data_factory_semantics.py"
      - "teacher-lab/training/data_factory_quality_smoke.py"
      - "teacher-lab/training/data_factory_semantics_smoke.py"
      - "teacher-lab/training/prepare_iteration2_dataset.py"
      - "teacher-lab/training/iteration2_readiness.py"
      - "teacher-lab/training/iteration2_readiness_smoke.py"
      - "teacher-lab/training/bai_iteration2_kaggle_train.ipynb"
      - "teacher-lab/training/iteration2_notebook_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - "teacher-lab/training/compare_candidate_runs.py"
      - "teacher-lab/training/candidate_comparison_smoke.py"
      - "teacher-lab/training/data_factory_v2.py"
      - "teacher-lab/training/data_factory_v22.py"
      - "teacher-lab/training/data_factory_semantics.py"
      - "teacher-lab/training/data_factory_quality_smoke.py"
      - "teacher-lab/training/data_factory_semantics_smoke.py"
      - "teacher-lab/training/prepare_iteration2_dataset.py"
      - "teacher-lab/training/iteration2_readiness.py"
      - "teacher-lab/training/iteration2_readiness_smoke.py"
      - "teacher-lab/training/bai_iteration2_kaggle_train.ipynb"
      - "teacher-lab/training/iteration2_notebook_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check failure learning syntax
        run: |
          python -m py_compile teacher-lab/training/diagnose_candidate_failures.py
          python -m py_compile teacher-lab/training/prepare_failure_remediation.py
          python -m py_compile teacher-lab/training/run_failure_regressions.py
          python -m py_compile teacher-lab/training/failure_learning_smoke.py
          python -m py_compile teacher-lab/training/compare_candidate_runs.py
          python -m py_compile teacher-lab/training/candidate_comparison_smoke.py
          python -m py_compile teacher-lab/training/data_factory_v2.py
          python -m py_compile teacher-lab/training/data_factory_v22.py
          python -m py_compile teacher-lab/training/data_factory_semantics.py
          python -m py_compile teacher-lab/training/data_factory_quality_smoke.py
          python -m py_compile teacher-lab/training/data_factory_semantics_smoke.py
          python -m py_compile teacher-lab/training/prepare_iteration2_dataset.py
          python -m py_compile teacher-lab/training/iteration2_readiness.py
          python -m py_compile teacher-lab/training/iteration2_readiness_smoke.py
          python -m py_compile teacher-lab/training/iteration2_notebook_smoke.py
          python -m json.tool teacher-lab/training/bai_iteration2_kaggle_train.ipynb >/dev/null
          node --check teacher-lab/training/export_failure_remediation.mjs
      - name: Validate failure to reviewed Gold and regression gate
        run: python teacher-lab/training/failure_learning_smoke.py
      - name: Validate iteration 2 readiness gate
        run: python teacher-lab/training/iteration2_readiness_smoke.py
      - name: Validate iteration 2 Kaggle notebook contract
        run: python teacher-lab/training/iteration2_notebook_smoke.py
      - name: Validate multi-candidate comparison contract
        run: python teacher-lab/training/candidate_comparison_smoke.py
      - name: Validate Data Factory v2.1 diversity base
        run: |
          python teacher-lab/training/data_factory_v2.py /tmp/bai-factory-v21.jsonl --pilot-out /tmp/bai-factory-v21-pilot.jsonl
          test "$(wc -l < /tmp/bai-factory-v21.jsonl)" -eq 1448
          test "$(wc -l < /tmp/bai-factory-v21-pilot.jsonl)" -eq 400
          python teacher-lab/training/data_factory_quality_smoke.py
      - name: Validate Data Factory v2.2 executable semantics
        run: |
          python teacher-lab/training/data_factory_v22.py /tmp/bai-factory-v22.jsonl --pilot-out /tmp/bai-factory-v22-pilot.jsonl
          test "$(wc -l < /tmp/bai-factory-v22.jsonl)" -eq 1448
          test "$(wc -l < /tmp/bai-factory-v22-pilot.jsonl)" -eq 400
          python teacher-lab/training/data_factory_semantics_smoke.py
