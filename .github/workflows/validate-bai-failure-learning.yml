name: Validate Bai failure learning

on:
  pull_request:
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - "teacher-lab/training/compare_candidate_runs.py"
      - "teacher-lab/training/candidate_comparison_smoke.py"
      - "teacher-lab/training/data_factory_v2.py"
      - "teacher-lab/training/prepare_iteration2_dataset.py"
      - "teacher-lab/training/iteration2_readiness.py"
      - "teacher-lab/training/iteration2_readiness_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - "teacher-lab/training/compare_candidate_runs.py"
      - "teacher-lab/training/candidate_comparison_smoke.py"
      - "teacher-lab/training/data_factory_v2.py"
      - "teacher-lab/training/prepare_iteration2_dataset.py"
      - "teacher-lab/training/iteration2_readiness.py"
      - "teacher-lab/training/iteration2_readiness_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check failure learning syntax
        run: |
          python -m py_compile teacher-lab/training/diagnose_candidate_failures.py
          python -m py_compile teacher-lab/training/prepare_failure_remediation.py
          python -m py_compile teacher-lab/training/run_failure_regressions.py
          python -m py_compile teacher-lab/training/failure_learning_smoke.py
          python -m py_compile teacher-lab/training/compare_candidate_runs.py
          python -m py_compile teacher-lab/training/candidate_comparison_smoke.py
          python -m py_compile teacher-lab/training/data_factory_v2.py
          python -m py_compile teacher-lab/training/prepare_iteration2_dataset.py
          python -m py_compile teacher-lab/training/iteration2_readiness.py
          python -m py_compile teacher-lab/training/iteration2_readiness_smoke.py
          node --check teacher-lab/training/export_failure_remediation.mjs
      - name: Validate failure to reviewed Gold and regression gate
        run: python teacher-lab/training/failure_learning_smoke.py
      - name: Validate iteration 2 readiness gate
        run: python teacher-lab/training/iteration2_readiness_smoke.py
      - name: Validate multi-candidate comparison contract
        run: python teacher-lab/training/candidate_comparison_smoke.py
      - name: Validate Data Factory v2 dedupe and balanced pilot
        run: |
          python teacher-lab/training/data_factory_v2.py /tmp/bai-factory-v2.jsonl --pilot-out /tmp/bai-factory-v2-pilot.jsonl
          test "$(wc -l < /tmp/bai-factory-v2.jsonl)" -eq 512
          test "$(wc -l < /tmp/bai-factory-v2-pilot.jsonl)" -eq 400
