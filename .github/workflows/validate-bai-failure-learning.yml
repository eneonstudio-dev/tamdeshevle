name: Validate Bai failure learning

on:
  pull_request:
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/training/diagnose_candidate_failures.py"
      - "teacher-lab/training/prepare_failure_remediation.py"
      - "teacher-lab/training/export_failure_remediation.mjs"
      - "teacher-lab/training/run_failure_regressions.py"
      - "teacher-lab/training/failure_learning_smoke.py"
      - ".github/workflows/validate-bai-failure-learning.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check failure learning syntax
        run: |
          python -m py_compile teacher-lab/training/diagnose_candidate_failures.py
          python -m py_compile teacher-lab/training/prepare_failure_remediation.py
          python -m py_compile teacher-lab/training/run_failure_regressions.py
          python -m py_compile teacher-lab/training/failure_learning_smoke.py
          node --check teacher-lab/training/export_failure_remediation.mjs
      - name: Validate failure to reviewed Gold and regression gate
        run: python teacher-lab/training/failure_learning_smoke.py
