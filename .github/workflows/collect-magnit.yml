name: Collect Magnit prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: collect-magnit-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'eneonstudio-dev/tamdeshevle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and validate one-store Magnit catalog
        id: refresh
        continue-on-error: true
        run: |
          set -e
          node scripts/collect-magnit.mjs
          node -e "const s=require('./data/retailers/magnit.sample.json'); if(s.scope_verified!==true) process.exit(2)"
          node scripts/test-magnit-collector.mjs
          node scripts/test-magnit-adapter.mjs
          node scripts/test-sku-matcher.mjs
          node scripts/test-retailer-overlay.mjs
          node scripts/validate-data.mjs
      - name: Record collector health
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" = "success" ]; then
            node scripts/update-collector-health.mjs magnit success "Collector and validation succeeded."
          else
            node scripts/update-collector-health.mjs magnit failure "Collector or validation failed; previous verified prices were kept."
          fi
      - name: Commit health and verified data
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            git restore -- data/retailers/magnit.sample.json data/retailers/magnit.overlay.json || true
          fi
          if git diff --quiet -- data/retailers/magnit.sample.json data/retailers/magnit.overlay.json data/retailers/collector-health.json; then
            echo "No Magnit data or health changes"
            exit 0
          fi
          git config user.name "tamdeshevle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/retailers/magnit.sample.json data/retailers/magnit.overlay.json data/retailers/collector-health.json
          git commit -m "Refresh Magnit collector state"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow when refresh failed
        if: steps.refresh.outcome != 'success'
        run: exit 1
