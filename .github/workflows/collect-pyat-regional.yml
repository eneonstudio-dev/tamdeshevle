name: Collect Pyaterochka regional catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-pyat-regional.yml"
      - "retailers/proshoper-collector.mjs"
      - "retailers/sku-matcher.mjs"
      - "retailers/overlay-builder.mjs"
      - "retailers/pyat.mjs"
      - "scripts/collect-pyat-proshoper.mjs"
      - "scripts/test-pyat-adapter.mjs"
      - "scripts/test-sku-matcher.mjs"
      - "data/retailers/pyat.proshoper.collector.json"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: collect-pyat-regional-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'eneonstudio-dev/tamdeshevle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Collect Moscow regional Pyaterochka catalog
        id: refresh
        continue-on-error: true
        run: |
          set -e
          # Keep regional estimates fail-closed: parser/date/provenance, rotation safety and false-positive guards must validate before replacing data.
          node scripts/collect-pyat-proshoper.mjs
          node -e "const s=require('./data/retailers/pyat.sample.json'); if(s.scope_verified!==false || s.source_kind!=='aggregator_catalog' || s.catalog_context?.price_scope!=='regional_catalog') process.exit(2)"
          node scripts/test-pyat-adapter.mjs
          node scripts/test-sku-matcher.mjs
          node scripts/test-retailer-overlay.mjs
          node scripts/validate-data.mjs
      - name: Record regional collector health
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" = "success" ]; then
            node scripts/update-collector-health.mjs pyat_regional success "Regional Proshoper catalog refresh and validation succeeded."
          else
            node scripts/update-collector-health.mjs pyat_regional failure "Regional Proshoper catalog refresh failed; previous catalog snapshot was kept."
          fi
      - name: Commit health and regional catalog data
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            git restore -- data/retailers/pyat.sample.json data/retailers/pyat.overlay.json || true
          fi
          if git diff --quiet -- data/retailers/pyat.sample.json data/retailers/pyat.overlay.json data/retailers/collector-health.json; then
            echo "No regional Pyaterochka data or health changes"
            exit 0
          fi
          git config user.name "tamdeshevle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/retailers/pyat.sample.json data/retailers/pyat.overlay.json data/retailers/collector-health.json
          git commit -m "Refresh Pyaterochka regional catalog"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow when refresh failed
        if: steps.refresh.outcome != 'success'
        run: exit 1
