name: Patch auth lifecycle release scope
on:
  push:
    branches: [rouk/gate-f-closed-beta-scope]
    paths: [.github/workflows/gate-f-auth-test-scope-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: rouk/gate-f-closed-beta-scope
      - name: Opt auth lifecycle fixture into remote scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-auth-lifecycle.mjs'); t=p.read_text()
          old="  const window={TD_SUPABASE:{url:'https://test.supabase.co',anonKey:'public-test-key-long-enough'},addEventListener(){},dispatchEvent:e=>events.push(e),render:()=>rendered++};"
          new="  const window={TDReleaseScope:{enabled:()=>true},TD_SUPABASE:{url:'https://test.supabase.co',anonKey:'public-test-key-long-enough'},addEventListener(){},dispatchEvent:e=>events.push(e),render:()=>rendered++};"
          if t.count(old)!=1: raise SystemExit('auth lifecycle fixture anchor mismatch')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit and remove helper
        run: |
          rm .github/workflows/gate-f-auth-test-scope-patch.yml
          git config user.name "eneonstudio-dev"
          git config user.email "eneonstudio@gmail.com"
          git add scripts/test-auth-lifecycle.mjs .github/workflows/gate-f-auth-test-scope-patch.yml
          git commit -m "test: opt auth lifecycle into remote release scope"
          git push origin HEAD:rouk/gate-f-closed-beta-scope
