name: Validate UX in real browser

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "*.css"
      - "*.js"
      - "scripts/test-ux-browser.py"
      - "scripts/test-compare-theme.py"
      - "scripts/test-roxy-decision.py"
      - "scripts/test-roxy-handoff.py"
      - "scripts/test-roxy-long-basket.py"
      - "scripts/test-roxy-mobile-compose.py"
      - "scripts/test-roxy-network-recovery.py"
      - "scripts/test-roxy-return-continuity.py"
      - "scripts/test-roxy-purchase-proof.py"
      - "scripts/test-roxy-catalog-hints.py"
      - "scripts/test-cold-start-home.py"
      - "scripts/test-mvp030-decision-explanation.py"
      - ".github/workflows/validate-ux-browser.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "*.css"
      - "*.js"
      - "scripts/test-ux-browser.py"
      - "scripts/test-compare-theme.py"
      - "scripts/test-roxy-decision.py"
      - "scripts/test-roxy-handoff.py"
      - "scripts/test-roxy-long-basket.py"
      - "scripts/test-roxy-mobile-compose.py"
      - "scripts/test-roxy-network-recovery.py"
      - "scripts/test-roxy-return-continuity.py"
      - "scripts/test-roxy-purchase-proof.py"
      - "scripts/test-roxy-catalog-hints.py"
      - "scripts/test-cold-start-home.py"
      - "scripts/test-mvp030-decision-explanation.py"
      - ".github/workflows/validate-ux-browser.yml"

permissions:
  contents: read

jobs:
  browser-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Start static site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/votonobay-http.log 2>&1 &
          echo $! >/tmp/votonobay-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/votonobay-http.log
          exit 1
      - name: Guard comparison dark theme
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-compare-theme.py
      - name: Run real-browser UX smoke QA
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-ux-browser.py
      - name: Validate cold-start Home
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-cold-start-home.py
      - name: Validate Roxy decision hierarchy
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-decision.py
      - name: Validate MVP-030 decision explanation
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-mvp030-decision-explanation.py
      - name: Validate Roxy purchase handoff
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-handoff.py
      - name: Validate Roxy long basket
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-long-basket.py
      - name: Validate Roxy mobile composer
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-mobile-compose.py
      - name: Validate Roxy network recovery
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-network-recovery.py
      - name: Validate Roxy return continuity
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-return-continuity.py
      - name: Validate Roxy purchase proof truth
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-purchase-proof.py
      - name: Validate Roxy catalog hint
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-roxy-catalog-hints.py
      - name: Upload UX screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-browser-qa
          path: artifacts/ux-browser
          if-no-files-found: warn
          retention-days: 7
