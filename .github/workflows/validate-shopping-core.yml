name: Validate golden shopping core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shopping-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Canonical dairy removal
        run: node scripts/test-mvp002-remove-dairy.mjs
      - name: Canonical product replacement
        run: node scripts/test-mvp003-replace-turkey.mjs
      - name: Soft savings meat-quality tradeoff
        run: node scripts/test-mvp004-soft-savings-meat-quality.mjs
      - name: Healthy no-sugar constraint
        run: node scripts/test-mvp011-healthy-no-sugar.mjs
      - name: Canonical convenience priority
        run: node scripts/test-mvp012-convenience-priority.mjs
      - name: Same-basket retailer reprojection
        run: node scripts/test-mvp015-same-basket-reprojection.mjs
      - name: Split optimizer regression
        run: node scripts/test-basket-split.mjs
      - name: Split UI and handoff contract
        run: node scripts/test-basket-split-ui.mjs
      - name: One-store optimizer choice
        run: node scripts/test-one-store-choice.mjs
      - name: Promo eligibility truth guard
        run: node scripts/test-promo-eligibility.mjs
      - name: Equal-cost plan tie-break
        run: node scripts/test-plan-tie-break.mjs
      - name: Explicit word quantity
        run: node scripts/test-mvp021-word-quantity.mjs
      - name: Explicit pack decrement
        run: node scripts/test-mvp022-decrement-pack.mjs
      - name: Canonical budget update
        run: node scripts/test-mvp023-budget-only.mjs
      - name: Brand preference relaxation
        run: node scripts/test-mvp024-brand-relax.mjs
      - name: Shopping state consistency
        run: node scripts/test-shopping-state-consistency.mjs
      - name: Unified cart state
        run: node scripts/test-unified-cart-state.mjs
      - name: Bay multi-store retailer scope
        run: node scripts/test-bai-multistore-scope.mjs
      - name: First shopping journey
        run: node scripts/test-first-shopping-journey.mjs
      - name: Bay shopping journey
        run: node scripts/test-bai-shopping-journey.mjs
      - name: Bay handoff end to end
        run: node scripts/test-bai-handoff-e2e.mjs
      - name: Sara 2 release UX acceptance
        run: node scripts/test-sara2-release-acceptance.mjs
      - name: Mobile Bay-first end to end
        run: node scripts/test-mobile-bay-first-e2e.mjs
