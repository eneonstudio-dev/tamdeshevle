name: Validate public brand gate

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.json"
      - "*.js"
      - "scripts/test-public-brand-gate.mjs"
      - "GATE_G_BRAND_PREFLIGHT.md"
      - "RELEASE_GATE.md"
      - ".github/workflows/validate-public-brand-gate.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.json"
      - "*.js"
      - "scripts/test-public-brand-gate.mjs"
      - "GATE_G_BRAND_PREFLIGHT.md"
      - "RELEASE_GATE.md"
      - ".github/workflows/validate-public-brand-gate.yml"

permissions:
  contents: read

jobs:
  public-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Guard public retailer-partnership claims and inventory brand tokens
        run: node scripts/test-public-brand-gate.mjs
