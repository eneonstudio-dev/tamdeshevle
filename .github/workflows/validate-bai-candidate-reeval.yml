name: Validate Bai candidate re-evaluation

on:
  pull_request:
    paths:
      - "teacher-lab/training/reevaluate_candidate.py"
      - "teacher-lab/training/reevaluate_candidate_smoke.py"
      - "teacher-lab/training/package_reeval_artifact.py"
      - "teacher-lab/training/package_reeval_artifact_smoke.py"
      - "teacher-lab/training/intake_reeval_handoff.py"
      - "teacher-lab/training/intake_reeval_handoff_smoke.py"
      - "teacher-lab/training/analyze_candidate_failures.py"
      - "teacher-lab/training/analyze_candidate_failures_smoke.py"
      - "teacher-lab/training/bai_candidate_kaggle_reeval.ipynb"
      - ".github/workflows/validate-bai-candidate-reeval.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/training/reevaluate_candidate.py"
      - "teacher-lab/training/reevaluate_candidate_smoke.py"
      - "teacher-lab/training/package_reeval_artifact.py"
      - "teacher-lab/training/package_reeval_artifact_smoke.py"
      - "teacher-lab/training/intake_reeval_handoff.py"
      - "teacher-lab/training/intake_reeval_handoff_smoke.py"
      - "teacher-lab/training/analyze_candidate_failures.py"
      - "teacher-lab/training/analyze_candidate_failures_smoke.py"
      - "teacher-lab/training/bai_candidate_kaggle_reeval.ipynb"
      - ".github/workflows/validate-bai-candidate-reeval.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check syntax and notebook contract
        run: |
          python -m py_compile teacher-lab/training/reevaluate_candidate.py
          python -m py_compile teacher-lab/training/reevaluate_candidate_smoke.py
          python -m py_compile teacher-lab/training/package_reeval_artifact.py
          python -m py_compile teacher-lab/training/package_reeval_artifact_smoke.py
          python -m py_compile teacher-lab/training/intake_reeval_handoff.py
          python -m py_compile teacher-lab/training/intake_reeval_handoff_smoke.py
          python -m py_compile teacher-lab/training/analyze_candidate_failures.py
          python -m py_compile teacher-lab/training/analyze_candidate_failures_smoke.py
          python -m json.tool teacher-lab/training/bai_candidate_kaggle_reeval.ipynb >/dev/null
          grep -q "notebook07f42bd563/versions/1" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
          grep -q "reevaluate_candidate.py" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
          grep -q "analyze_candidate_failures.py" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
          grep -q "compare_candidate_runs.py" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
          grep -q "corrected-candidate" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
          grep -q "package_reeval_artifact.py" teacher-lab/training/bai_candidate_kaggle_reeval.ipynb
      - name: Validate existing candidate re-evaluation contract
        run: python teacher-lab/training/reevaluate_candidate_smoke.py
      - name: Validate portable re-eval handoff intake
        run: python teacher-lab/training/intake_reeval_handoff_smoke.py
      - name: Validate candidate failure clustering contract
        run: python teacher-lab/training/analyze_candidate_failures_smoke.py
