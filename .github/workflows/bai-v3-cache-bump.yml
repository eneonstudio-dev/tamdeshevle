name: Patch Bay V3 observability cache key

on:
  push:
    branches: [rouk/bai-v3-chat-quality-observability]
    paths: [".github/workflows/bai-v3-cache-bump.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rouk/bai-v3-chat-quality-observability
      - name: Bump observability cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          old='./bai-observability.js?v=20260913-observability-v1'
          new='./bai-observability.js?v=20260915-chat-quality-v2'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one old cache key, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq './bai-observability.js?v=20260915-chat-quality-v2' supabase-config.js
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bai-v3-cache-bump.yml
          git config user.name "eneonstudio-dev"
          git config user.email "eneonstudio@gmail.com"
          git add supabase-config.js .github/workflows/bai-v3-cache-bump.yml
          git commit -m "fix: bust Bay observability cache for V3"
          git push origin HEAD:rouk/bai-v3-chat-quality-observability
