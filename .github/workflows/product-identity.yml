name: Validate product identity cascade

on:
  pull_request:
    paths:
      - 'retailers/product-identity.mjs'
      - 'scripts/test-product-identity.mjs'
      - '.github/workflows/product-identity.yml'
  push:
    branches:
      - main
    paths:
      - 'retailers/product-identity.mjs'
      - 'scripts/test-product-identity.mjs'
      - '.github/workflows/product-identity.yml'

permissions:
  contents: read

jobs:
  product-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check retailers/product-identity.mjs && node --check scripts/test-product-identity.mjs
      - name: Test barcode identity cascade
        run: node scripts/test-product-identity.mjs
