name: Validate product identity cascade

on:
  pull_request:
    paths:
      - 'retailers/product-identity.mjs'
      - 'retailers/receipt-product-identity.mjs'
      - 'scripts/import-product-identities.mjs'
      - 'scripts/test-product-identity.mjs'
      - 'scripts/test-product-identity-importer.mjs'
      - 'scripts/test-receipt-product-identity.mjs'
      - 'data/product-identity/**'
      - '.github/workflows/product-identity.yml'
  push:
    branches:
      - main
    paths:
      - 'retailers/product-identity.mjs'
      - 'retailers/receipt-product-identity.mjs'
      - 'scripts/import-product-identities.mjs'
      - 'scripts/test-product-identity.mjs'
      - 'scripts/test-product-identity-importer.mjs'
      - 'scripts/test-receipt-product-identity.mjs'
      - 'data/product-identity/**'
      - '.github/workflows/product-identity.yml'

permissions:
  contents: read

jobs:
  product-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check retailers/product-identity.mjs
          node --check retailers/receipt-product-identity.mjs
          node --check scripts/import-product-identities.mjs
          node --check scripts/test-product-identity.mjs
          node --check scripts/test-product-identity-importer.mjs
          node --check scripts/test-receipt-product-identity.mjs
      - name: Test barcode identity cascade
        run: node scripts/test-product-identity.mjs
      - name: Test sharded identity importer
        run: node scripts/test-product-identity-importer.mjs
      - name: Test receipt identity bridge
        run: node scripts/test-receipt-product-identity.mjs
