name: Validate mobile Search tap

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "v2-shell.js"
      - "v2-mobile-dock.js"
      - "scripts/test-mobile-search-tap.py"
      - ".github/workflows/validate-mobile-search-tap.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "v2-shell.js"
      - "v2-mobile-dock.js"
      - "scripts/test-mobile-search-tap.py"
      - ".github/workflows/validate-mobile-search-tap.yml"

permissions:
  contents: read

jobs:
  physical-search-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Start static site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/votonobay-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/votonobay-http.log
          exit 1
      - name: Physically tap visible mobile Search
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-mobile-search-tap.py
