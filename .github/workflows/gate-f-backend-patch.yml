name: Apply Gate F backend patch

on:
  push:
    branches: [rouk/gate-f-zero-budget-privacy]
    paths:
      - ".github/workflows/gate-f-backend-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: rouk/gate-f-zero-budget-privacy
      - name: Add explicit zero-budget kill switch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/bai-agent-core.ts")
          source = path.read_text()
          old = '''async function reasonNode(state:typeof State.State){
            const base=(Deno.env.get("BAI_LLM_BASE_URL")||"").trim().replace(/\/$/,"");'''
          new = '''async function reasonNode(state:typeof State.State){
            const paidEnabled=(Deno.env.get("BAI_LLM_PAID_ENABLED")||"").trim().toLowerCase()==="true";
            if(!paidEnabled)return {error:"model_disabled_zero_budget",model:"disabled",trace:["reason"]};
            const base=(Deno.env.get("BAI_LLM_BASE_URL")||"").trim().replace(/\/$/,"");'''
          if old not in source:
              raise SystemExit("reasonNode patch anchor not found")
          source = source.replace(old, new, 1)
          old = 'if(result.error==="model_not_configured"){'
          new = 'if(result.error==="model_not_configured"||result.error==="model_disabled_zero_budget"){' 
          if old not in source:
              raise SystemExit("fallback patch anchor not found")
          source = source.replace(old, new, 1)
          path.write_text(source)
          Path(".github/workflows/gate-f-backend-patch.yml").unlink()
          PY
      - name: Commit scoped patch and remove helper
        run: |
          git config user.name "eneonstudio-dev"
          git config user.email "eneonstudio@gmail.com"
          git add backend/bai-agent-core.ts .github/workflows/gate-f-backend-patch.yml
          git commit -m "security: require explicit paid LLM enable"
          git push origin HEAD:rouk/gate-f-zero-budget-privacy
