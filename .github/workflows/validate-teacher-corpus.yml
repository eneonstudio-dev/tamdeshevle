name: Validate Bai Teacher Corpus

on:
  pull_request:
    paths:
      - "teacher-lab/**"
      - ".github/workflows/validate-teacher-corpus.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/**"
      - ".github/workflows/validate-teacher-corpus.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check corpus tooling syntax
        run: |
          node --check teacher-lab/firewall.mjs
          node --check teacher-lab/benchmark.mjs
          node --check teacher-lab/corpus-builder.mjs
          node --check teacher-lab/corpus-smoke.mjs
          node --check teacher-lab/batch-manifest.mjs
          node --check teacher-lab/export-corpus.mjs
          node --check teacher-lab/batch-smoke.mjs
          node --check teacher-lab/candidate-import.mjs
          node --check teacher-lab/candidate-smoke.mjs
          node --check teacher-lab/training/prepare-sft.mjs
          node --check teacher-lab/training/promotion-gate.mjs
          node --check teacher-lab/training/training-smoke.mjs
      - name: Validate profiles and generated corpus
        run: node teacher-lab/corpus-smoke.mjs
      - name: Validate deterministic batches
        run: node teacher-lab/batch-smoke.mjs
      - name: Validate candidate import gates
        run: node teacher-lab/candidate-smoke.mjs
      - name: Validate student training recipe
        run: node teacher-lab/training/training-smoke.mjs
      - name: Exercise offline export
        run: |
          rm -rf /tmp/bai-teacher-export
          node teacher-lab/export-corpus.mjs /tmp/bai-teacher-export
          test -s /tmp/bai-teacher-export/corpus.jsonl
          test -s /tmp/bai-teacher-export/manifest.json
          test "$(find /tmp/bai-teacher-export/batches -name 'batch_*.jsonl' | wc -l)" -eq 9
