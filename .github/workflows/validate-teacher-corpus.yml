name: Validate Bai Teacher Corpus

on:
  pull_request:
    paths:
      - "teacher-lab/**"
      - ".github/workflows/validate-teacher-corpus.yml"
  push:
    branches:
      - main
    paths:
      - "teacher-lab/**"
      - ".github/workflows/validate-teacher-corpus.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check corpus tooling syntax
        run: |
          node --check teacher-lab/firewall.mjs
          node --check teacher-lab/benchmark.mjs
          node --check teacher-lab/corpus-builder.mjs
          node --check teacher-lab/corpus-smoke.mjs
          node --check teacher-lab/batch-manifest.mjs
          node --check teacher-lab/export-corpus.mjs
          node --check teacher-lab/batch-smoke.mjs
          node --check teacher-lab/candidate-import.mjs
          node --check teacher-lab/candidate-smoke.mjs
          node --check teacher-lab/run-local-batch.mjs
          node --check teacher-lab/teacher-consensus.mjs
          node --check teacher-lab/teacher-run-smoke.mjs
          node --check teacher-lab/review-teacher-pair.mjs
          node --check teacher-lab/review-pair-smoke.mjs
          node --check teacher-lab/review-decision.mjs
          node --check teacher-lab/review-decision-smoke.mjs
          node --check teacher-lab/review-console.mjs
          node --check teacher-lab/review-console-smoke.mjs
          node --check teacher-lab/gpu/prepare_review.mjs
          node --check teacher-lab/training/prepare-sft.mjs
          node --check teacher-lab/training/review-export.mjs
          node --check teacher-lab/training/aggregate-gold.mjs
          node --check teacher-lab/training/aggregate-gold-smoke.mjs
          node --check teacher-lab/training/promotion-gate.mjs
          node --check teacher-lab/training/training-smoke.mjs
          python -m py_compile teacher-lab/review-artifact.py
          python -m py_compile teacher-lab/review-artifact-smoke.py
          python -m py_compile teacher-lab/gpu/kaggle_t4x2_teachers.py
          python -m py_compile teacher-lab/gpu/kaggle_load_order_smoke.py
          python -m py_compile teacher-lab/gpu/kaggle_runall.py
          python -m py_compile teacher-lab/training/train_student.py
          python -m json.tool teacher-lab/gpu/bai_teacher_kaggle_runall.ipynb >/dev/null
          python -m json.tool teacher-lab/training/bai_student_kaggle_train.ipynb >/dev/null
          grep -q "kaggle_runall.py" teacher-lab/gpu/bai_teacher_kaggle_runall.ipynb
          grep -q "train_student.py" teacher-lab/training/bai_student_kaggle_train.ipynb
      - name: Validate profiles and generated corpus
        run: node teacher-lab/corpus-smoke.mjs
      - name: Validate deterministic batches
        run: node teacher-lab/batch-smoke.mjs
      - name: Validate candidate import gates
        run: node teacher-lab/candidate-smoke.mjs
      - name: Validate local teacher runner and consensus
        run: node teacher-lab/teacher-run-smoke.mjs
      - name: Validate teacher pair review queue
        run: node teacher-lab/review-pair-smoke.mjs
      - name: Validate explicit review decisions
        run: node teacher-lab/review-decision-smoke.mjs
      - name: Validate offline review console
        run: node teacher-lab/review-console-smoke.mjs
      - name: Validate review artifact workflow
        run: python teacher-lab/review-artifact-smoke.py
      - name: Validate Kaggle teacher load order
        run: python teacher-lab/gpu/kaggle_load_order_smoke.py
      - name: Validate cumulative Gold aggregation
        run: node teacher-lab/training/aggregate-gold-smoke.mjs
      - name: Validate student training recipe
        run: node teacher-lab/training/training-smoke.mjs
      - name: Exercise offline export
        run: |
          rm -rf /tmp/bai-teacher-export
          node teacher-lab/export-corpus.mjs /tmp/bai-teacher-export
          test -s /tmp/bai-teacher-export/corpus.jsonl
          test -s /tmp/bai-teacher-export/manifest.json
          test "$(find /tmp/bai-teacher-export/batches -name 'batch_*.jsonl' | wc -l)" -eq 9
