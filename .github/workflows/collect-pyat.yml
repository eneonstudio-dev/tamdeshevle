name: Collect Pyaterochka prices

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: write

concurrency:
  group: collect-pyat-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'eneonstudio-dev/tamdeshevle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect one-store Pyaterochka public catalog
        run: node scripts/collect-pyat.mjs
      - name: Validate collected overlay
        run: |
          node scripts/test-pyat-collector.mjs
          node scripts/test-pyat-adapter.mjs
          node scripts/test-sku-matcher.mjs
          node scripts/test-retailer-overlay.mjs
          node scripts/validate-data.mjs
      - name: Commit only verified store-scoped data
        run: |
          node -e "const s=require('./data/retailers/pyat.sample.json'); if(s.scope_verified!==true) process.exit(2)"
          if git diff --quiet -- data/retailers/pyat.sample.json data/retailers/pyat.overlay.json; then
            echo "No Pyaterochka changes"
            exit 0
          fi
          git config user.name "tamdeshevle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/retailers/pyat.sample.json data/retailers/pyat.overlay.json
          git commit -m "Refresh store-scoped Pyaterochka prices"
          git push origin HEAD:main
