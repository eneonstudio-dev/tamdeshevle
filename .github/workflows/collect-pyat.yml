name: Collect Pyaterochka prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-pyat.yml"
      - "retailers/pyat-collector.mjs"
      - "scripts/collect-pyat.mjs"
      - "data/retailers/pyat.collector.json"
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: write

concurrency:
  group: collect-pyat-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'eneonstudio-dev/tamdeshevle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Collect and validate one-store Pyaterochka catalog
        id: refresh
        continue-on-error: true
        run: |
          set -e
          node scripts/collect-pyat.mjs
          node -e "const s=require('./data/retailers/pyat.sample.json'); if(s.scope_verified!==true) process.exit(2)"
          node scripts/test-pyat-collector.mjs
          node scripts/test-pyat-adapter.mjs
          node scripts/test-sku-matcher.mjs
          node scripts/test-retailer-overlay.mjs
          node scripts/validate-data.mjs
      - name: Record collector health
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          COLLECTOR_ERROR: ${{ steps.refresh.outputs.error_code }}
        run: |
          if [ "$REFRESH_OUTCOME" = "success" ]; then
            node scripts/update-collector-health.mjs pyat success "Store-scoped collector and validation succeeded."
          else
            node scripts/update-collector-health.mjs pyat failure "Collector failed (${COLLECTOR_ERROR:-unknown}); previous verified data were kept."
          fi
      - name: Commit health and verified data
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            git restore -- data/retailers/pyat.sample.json data/retailers/pyat.overlay.json || true
          fi
          if git diff --quiet -- data/retailers/pyat.sample.json data/retailers/pyat.overlay.json data/retailers/collector-health.json; then
            echo "No Pyaterochka data or health changes"
            exit 0
          fi
          git config user.name "tamdeshevle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/retailers/pyat.sample.json data/retailers/pyat.overlay.json data/retailers/collector-health.json
          git commit -m "Refresh Pyaterochka collector state"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow when refresh failed
        if: steps.refresh.outcome != 'success'
        run: exit 1
