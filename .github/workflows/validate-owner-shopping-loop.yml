name: Validate owner Bay shopping loop

on:
  pull_request:
    paths:
      - "index.html"
      - "bai-assistant.js"
      - "ai-shopping-assistant.js"
      - "bai-brain.js"
      - "bai-reasoning-guard.js"
      - "bai-shopping-agent-kernel.js"
      - "shopping-state.js"
      - "shopping-conversation.js"
      - "shopping-optimizer.js"
      - "bai-checkout.js"
      - "unified-cart-state-v1.js"
      - "scripts/diagnose-owner-route.py"
      - "scripts/test-owner-shopping-loop.py"
      - ".github/workflows/validate-owner-shopping-loop.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "bai-assistant.js"
      - "ai-shopping-assistant.js"
      - "bai-brain.js"
      - "bai-reasoning-guard.js"
      - "bai-shopping-agent-kernel.js"
      - "shopping-state.js"
      - "shopping-conversation.js"
      - "shopping-optimizer.js"
      - "bai-checkout.js"
      - "unified-cart-state-v1.js"
      - "scripts/diagnose-owner-route.py"
      - "scripts/test-owner-shopping-loop.py"
      - ".github/workflows/validate-owner-shopping-loop.yml"

permissions:
  contents: read

jobs:
  owner-shopping-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Start static site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/votonobay-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/votonobay-http.log
          exit 1
      - name: Trace first owner route
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/diagnose-owner-route.py
      - name: Replay exact owner conversation through physical Bay UI
        env:
          TD_UX_BASE_URL: http://127.0.0.1:4173/
        run: python scripts/test-owner-shopping-loop.py
